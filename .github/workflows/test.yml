name: tests

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: typecheck + unit tests + build
    runs-on: ubuntu-latest
    env:
      # Puppeteer's Chromium download is only needed at runtime for PDF rendering.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck (tests included)
        run: npm run check

      - name: Unit tests (no DB, no AI keys) — with the coverage gate
        run: npm run test:coverage

      - name: E2E specs parse (no browser, no server, no secrets)
        run: npm run test:e2e:list

      - name: Build
        run: npm run build

  # Added in step 4 of testing-blueprint/00-testing-strategy.md:
  # - integration job against a Neon branch (DATABASE_URL_TEST)
  # - e2e job with Playwright + Clerk test instance
  # A live AI benchmark is NEVER part of this workflow.

  # The browser suite is written and never runs. That is a gap, and a gap that is invisible in
  # the Checks list is a gap that stays: this job does not fail the build, it says out loud that
  # the money paths are untested end to end. Switch the suite on by setting the repository
  # variable E2E_ENABLED=true and adding the secrets the `e2e` job below reads
  # (E2E_CLERK_SECRET_KEY, ENCRYPTION_KEY) plus the variable E2E_CLERK_PUBLISHABLE_KEY.
  e2e-status:
    name: e2e (status)
    runs-on: ubuntu-latest
    steps:
      - name: Report whether the browser suite is running
        if: ${{ vars.E2E_ENABLED != 'true' }}
        run: |
          echo "::warning title=Browser tests are switched off::10 Playwright specs exist (add expense, import, checkout, accessibility) but none of them run in CI. Set the repository variable E2E_ENABLED=true to switch them on."
      - name: Confirm the browser suite is running
        if: ${{ vars.E2E_ENABLED == 'true' }}
        run: echo "Browser suite enabled; see the e2e job."

  integration:
    name: integration (throwaway Postgres)
    runs-on: ubuntu-latest
    # A disposable database inside the job: nothing to configure, nothing shared, nothing to clean up.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: kaptia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      DATABASE_URL: postgresql://ci:ci@localhost:5432/kaptia_test
      DATABASE_URL_TEST: postgresql://ci:ci@localhost:5432/kaptia_test
      # A release must never pass because the database tests skipped themselves.
      REQUIRE_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Create the schema from the migration files
        run: npm run db:migrate
      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    # Opt-in: set the repository variable E2E_ENABLED=true and provide a staging URL.
    if: ${{ vars.E2E_ENABLED == 'true' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: kaptia_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      E2E_ENABLED: '1'
      # Empty means "the server this job starts itself" — see the `||` in playwright.config.ts.
      # Set the repository variable only to point the suite at an already-running deployment.
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'http://localhost:5000' }}
      E2E_LOCALE: ${{ vars.E2E_LOCALE || 'sk' }}
      E2E_MANAGED_SERVER: '1'
      DATABASE_URL: postgresql://ci:ci@localhost:5432/kaptia_e2e
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.E2E_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Create the schema from the migration files
        run: npm run db:migrate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
