<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Kaptia - offline</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f7f8fc; color: #111827; }
    @media (prefers-color-scheme: dark) { body { background: #07080f; color: #f9fafb; } }
    main { max-width: 22rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
    p { margin: .25rem 0; color: #6b7280; line-height: 1.5; }
    button { margin-top: 1.25rem; padding: .7rem 1.4rem; border: 0; border-radius: .75rem; background: #4f46e5; color: #fff; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">You are offline</h1>
    <p id="text">Kaptia needs an internet connection to load your money data safely. Check your connection and try again.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    var texts = {
      es: ['Sin conexión', 'Kaptia necesita internet para cargar tus datos de forma segura. Revisa tu conexión e inténtalo de nuevo.', 'Reintentar'],
      sk: ['Ste offline', 'Kaptia potrebuje pripojenie na internet, aby bezpečne načítala vaše údaje. Skontrolujte pripojenie a skúste to znova.', 'Skúsiť znova']
    };
    var lang = (location.pathname.split('/')[1] || (navigator.language || 'en').slice(0, 2)).slice(0, 2);
    var t = texts[lang];
    if (t) {
      document.documentElement.lang = lang;
      document.getElementById('title').textContent = t[0];
      document.getElementById('text').textContent = t[1];
      document.getElementById('retry').textContent = t[2];
    }
    document.getElementById('retry').addEventListener('click', function () { location.reload(); });
  </script>
</body>
</html>
