<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Kaptia - Smart Spending Tracker with AI Insights | Receipts, Voice & Budgets</title>
    <meta name="author" content="Kaptia" />
    
    <!--
      Google Analytics / Google Ads are NOT loaded here on purpose.
      They are injected by client/src/lib/analytics.ts only after the visitor clicks
      "Accept" in the cookie banner. A hardcoded snippet in this file used to load gtag
      for every visitor before any choice was made; that is why the banner looked like
      it worked while tracking ran anyway.
    -->

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    
    <!-- Typography
         The web fonts are a third-party request, so they are loaded only after the visitor
         allows functional cookies (client/src/lib/consent.ts). Loading them here made three
         external requests before the banner had been answered. -->

    
    <!-- Open Graph, Twitter, canonical, hreflang, description and robots are written per page by
         client/src/components/SEO.tsx (and server/ssr.ts for crawlers). Static copies here would
         sit next to them as duplicates, with the home page's address on every page. -->

    <!-- Additional SEO Meta Tags -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="msapplication-TileColor" content="#4f46e5" />
    <meta name="application-name" content="Kaptia" />
    <meta name="apple-mobile-web-app-title" content="Kaptia" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- Structured Data for Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Kaptia",
      "description": "Smart spending tracker with AI-powered receipt scanning, voice expense input, statement import, budgets and collaborative savings goals.",
      "url": "https://kaptia.app",
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "category": "Free"
      },
      "author": {
        "@type": "Organization",
        "name": "Kaptia"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
