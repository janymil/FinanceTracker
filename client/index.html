<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    
    <!-- Primary Meta Tags -->
    <title>Kaptia - Smart Spending Tracker with AI Insights | Receipts, Voice & Budgets</title>
    <meta name="title" content="Kaptia - Smart Spending Tracker with AI Insights | Receipts, Voice & Budgets" />
    <meta name="description" content="Kaptia turns receipts, voice notes and statements into a clear picture of your spending. Snap a photo, speak a note, or import a file - AI organizes the rest. Start free today!" />
    <meta name="keywords" content="spending tracker, expense tracker, budget planner, receipt scanner, voice expense input, AI categorization, savings goals, smart budgeting, expense tracking" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="author" content="Kaptia" />
    <link rel="canonical" href="https://kaptia.app" />
    
    <!--
      Google Analytics / Google Ads are NOT loaded here on purpose.
      They are injected by client/src/lib/analytics.ts only after the visitor clicks
      "Accept" in the cookie banner. A hardcoded snippet in this file used to load gtag
      for every visitor before any choice was made; that is why the banner looked like
      it worked while tracking ran anyway.
    -->

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kaptia.app" />
    <meta property="og:title" content="Kaptia - Smart Spending Tracker with AI Insights" />
    <meta property="og:description" content="Snap receipts, speak expenses, import statements. Kaptia's AI organizes your spending into clear insights and budgets. Start free today!" />
    <meta property="og:image" content="https://kaptia.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Kaptia" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://kaptia.app" />
    <meta property="twitter:title" content="Kaptia - Smart Spending Tracker with AI Insights" />
    <meta property="twitter:description" content="Snap receipts, speak expenses, import statements. AI organizes your spending into clear insights and budgets. Start free today!" />
    <meta property="twitter:image" content="https://kaptia.app/twitter-image.png" />
    <meta property="twitter:creator" content="@kaptia" />
    
    <!-- Additional SEO Meta Tags -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="msapplication-TileColor" content="#4f46e5" />
    <meta name="application-name" content="Kaptia" />
    <meta name="apple-mobile-web-app-title" content="Kaptia" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- Structured Data for Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Kaptia",
      "description": "Smart spending tracker with AI-powered receipt scanning, voice expense input, statement import, budgets and collaborative savings goals.",
      "url": "https://kaptia.app",
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "category": "Free"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "150"
      },
      "author": {
        "@type": "Organization",
        "name": "Kaptia"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
