# Where the copies go, and which client to use.
#
# A drop-in rather than an edit of the unit, so `kaptia-db-dump.service` stays the reviewed
# version and the machine-specific part stays visible in one small file.
#
# Install:
#   install -d /etc/systemd/system/kaptia-db-dump.service.d
#   install -m 0644 destination.conf /etc/systemd/system/kaptia-db-dump.service.d/
#   systemctl daemon-reload && systemctl start kaptia-db-dump.service   # one run, read the log
#   systemctl enable --now kaptia-db-dump.timer
#
# BACKUP_DIR is a directory on this host. That protects against the failure that is actually
# likely — a bad delete, a bad migration, an application bug — and not against losing the
# machine. Moving off-host is `BACKUP_S3_BUCKET` (+ endpoint and keys) in .env; the script prefers
# the bucket when it is configured and nothing here changes.
#
# The client is pinned to 17 because the server is PostgreSQL 17: `pg_dump` refuses a server
# newer than itself, and this host also carries the 16 client from the distribution.
[Service]
Environment=BACKUP_DIR=/var/backups/kaptia
Environment=BACKUP_RETAIN_DAYS=30
Environment=PG_DUMP_BINARY=/usr/lib/postgresql/17/bin/pg_dump
Environment=PG_RESTORE_BINARY=/usr/lib/postgresql/17/bin/pg_restore
