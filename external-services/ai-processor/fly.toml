app = "finanzerpro"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    BUILDKIT_INLINE_CACHE = "0"

[env]
  PORT = "8080"

[processes]
  app = "npx tsx index.ts"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "30s"
  interval = "60s"
  method = "GET"
  timeout = "10s"
  path = "/health"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512